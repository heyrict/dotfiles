# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, 1920x1200@90.00Hz, 0x0, 1
monitor = ,preferred,auto,auto

# unscale XWayland
xwayland {
  force_zero_scaling = true
}


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = alacritty --class yazi -e yazi
$browser = zen-browser
$menu = wofi --show drun


##############
### THEMES ###
##############

source = themes/catppuccin/mocha.conf # colorscheme

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

# Reset backlight
exec-once = echo "$(cat /sys/class/backlight/amdgpu_bl1/max_brightness) / 18" | bc > /sys/class/backlight/amdgpu_bl1/brightness

# Hypr ecosystem
exec-once = hyprpm reload -n
exec-once = hypridle
exec-once = hyprsunset
exec-once = hyprpaper

# Load desktop and services
exec-once = /usr/bin/xwayland-satellite &
exec-once = ~/.config/waybar/waybar.sh &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland
exec-once = fcitx5 -d
#exec-once = gammastep-indicator &
exec-once = dunst &
exec-once = xwayland-satellite &

# Set Screen brightness
exec-once = ~/.scripts/notify/change-brightness optimal


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

ecosystem {
  enforce_permissions = 1
}

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
permission = /usr/(bin|local/bin)/hyprlock, screencopy, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    #layout = dwindle
    layout = hy3
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        tap-to-click = true
        natural_scroll = true
        drag_lock = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = MOD1 # Sets "ALT" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, N, exec, $fileManager
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, SPACE, hy3:togglefocuslayer, nowarp
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, E, togglesplit, # dwindle
bind = $mainMod, I, exec, alacritty -t "dict_lookup | float" -o window.dimensions.columns=72 -o window.dimensions.lines=32 -o window.position.x=200 -o window.position.y=200 -o font.size=12 -e bash -c 'sdcv -cn "$(wl-paste -p)" | less -R'
bind = $mainMod SHIFT, I, exec, alacritty -t 'dict_lookup | float' -o font.size=12 -o window.dimensions.columns=72 -o window.dimensions.lines=32 -o window.position.x=200 -o window.position.y=200 -e bash -c 'sdcv -c'

# Launch mode
bind = $mainMod, D, submap, launch

submap = launch
bind = , D, exec, $menu
bind = , D, submap, reset
bind = , F, exec, $browser
bind = , F, submap, reset
bind = , N, exec, $fileManager
bind = , N, submap, reset
bind = , P, exec, ~/.config/sway/scripts/powermenu
bind = , P, submap, reset
bind = , G, exec, alacritty -t 'navi | float' -o window.dimensions.columns=150 -o window.dimensions.lines=38 -e bash -c 'env NAVI_PATH=~/.config/navi/custom navi && read -t60'
bind = , G, submap, reset
bind = SHIFT, 5, exec, ~/.scripts/theme.sh
bind = SHIFT, 5, submap, reset
bind = , Equal, exec, alacritty -t 'qalc | float' -o window.dimensions.columns=150 -o window.dimensions.lines=38 -e qalc
bind = , Equal, submap, reset

bind = , Q, submap, reset
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# Move focus
bind = $mainMod, left, hy3:movefocus, l
bind = $mainMod, right, hy3:movefocus, r
bind = $mainMod, up, hy3:movefocus, u
bind = $mainMod, down, hy3:movefocus, d
bind = $mainMod, H, hy3:movefocus, l
bind = $mainMod, L, hy3:movefocus, r
bind = $mainMod, K, hy3:movefocus, u
bind = $mainMod, J, hy3:movefocus, d

# Tabs (hy3)
bind = $mainMod, B, hy3:makegroup, h
bind = $mainMod, V, hy3:makegroup, v
bind = $mainMod, W, hy3:makegroup, tab
bind = $mainMod, S, hy3:makegroup, untab

# Move window
bind = $mainMod SHIFT, left, hy3:movewindow, l
bind = $mainMod SHIFT, right, hy3:movewindow, r
bind = $mainMod SHIFT, up, hy3:movewindow, u
bind = $mainMod SHIFT, down, hy3:movewindow, d
bind = $mainMod SHIFT, H, hy3:movewindow, l
bind = $mainMod SHIFT, L, hy3:movewindow, r
bind = $mainMod SHIFT, K, hy3:movewindow, u
bind = $mainMod SHIFT, J, hy3:movewindow, d

bind = $mainMod, C, centerwindow, 1

# Resize window
bind = $mainMod, R, submap, resize

submap = resize
binde = , left, resizeactive, -10 0
binde = , right, resizeactive, 10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
binde = SHIFT, left, resizeactive, -50 0
binde = SHIFT, right, resizeactive, 50 0
binde = SHIFT, up, resizeactive, 0 -50
binde = SHIFT, down, resizeactive, 0 50
binde = , H, resizeactive, -10 0
binde = , L, resizeactive, 10 0
binde = , K, resizeactive, 0 -10
binde = , J, resizeactive, 0 10
binde = SHIFT, H, resizeactive, -50 0
binde = SHIFT, L, resizeactive, 50 0
binde = SHIFT, K, resizeactive, 0 -50
binde = SHIFT, J, resizeactive, 0 50
bind = , F, fullscreen, 0
bind = , M, fullscreen, 1

bind = , 1, resizeactive, exact 400 300
bind = , 2, resizeactive, exact 480 360
bind = , 3, resizeactive, exact 560 420
bind = , 4, resizeactive, exact 640 480
bind = , 5, resizeactive, exact 800 600
bind = , 6, resizeactive, exact 1024 768
bind = , 7, resizeactive, exact 1200 900

bind = SHIFT, 1, resizeactive, exact 480 270
bind = SHIFT, 2, resizeactive, exact 640 360
bind = SHIFT, 3, resizeactive, exact 900 450
bind = SHIFT, 4, resizeactive, exact 1060 540
bind = SHIFT, 5, resizeactive, exact 1280 720
bind = SHIFT, 6, resizeactive, exact 1366 768
bind = SHIFT, 7, resizeactive, exact 1600 900

bind = , Q, submap, reset
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1

# DPMS
bind = $mainMod, bracketright, exec, sleep 1 && hyprctl dispatch dpms off
bind = $mainMod, bracketleft, exec, sleep 1 && hyprctl dispatch dpms on

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, GRAVE, togglespecialworkspace, magic
bind = $mainMod SHIFT, GRAVE, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
#bindm = $mainMod, Control_L, movewindow
#bindm = $mainMod, SHIFT_L, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, ~/.scripts/notify/change-volume up
bindel = ,XF86AudioLowerVolume, exec, ~/.scripts/notify/change-volume down
bindel = ,XF86AudioMute, exec, ~/.scripts/notify/change-volume mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.scripts/notify/change-brightness up
bindel = ,XF86MonBrightnessDown, exec, ~/.scripts/notify/change-brightness down

# Screenshot
bind = $mainMod, PRINT, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = , PRINT, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = $shiftMod, PRINT, exec, hyprshot -m region -o ~/Pictures/Screenshots
# Remove hyprshot border; Refer: https://github.com/Gustash/Hyprshot/issues/60
layerrule = match:class selector, no_anim on

# Monitors
bind = $mainMod, F8, exec, hyprctl keyword monitor "eDP-1, 1920x1200@90.00Hz, 0x0, 1"
bind = $mainMod SHIFT, F8, exec, hyprctl keyword monitor "eDP-1, disable"

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule {
    name = fix-dragging
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Automatic Floating
# Enable floating for windows with class matching config
windowrule = match:class config, float on
windowrule = match:title ^.*float$, float on
windowrule = match:class ^mpv$, float on
windowrule = match:class ^Pcsx2$, float on
windowrule = match:title ^gifview:, float on
windowrule = match:title ^Ｋａｎｏｎ, float on
windowrule = match:title ^QQ, float on
windowrule = match:class ^Steam$, float on
windowrule = match:title ^Choose a.*$, size 1200 720
windowrule = match:title ^Extension: .*TJDict, float on
windowrule = match:title ^Extension: .*TJDict, size 600 800
windowrule = match:title ^Extension: \(Aria2, float on
windowrule = match:title wemeetapp$, float on
windowrule = match:class TigerVNC$, float on
windowrule = match:class Ryujinx, float on
windowrule = match:class ^(?i)emuera, float on
windowrule = match:class ^(?i)emuera, move 0 -30
windowrule = match:class ^(?i)emuera, size 1940 1240
windowrule = match:class org-weasis-launcher-AppLauncher$, float on
windowrule = match:class wechat, float on
windowrule = match:class steam_app_405900, float on
windowrule = match:class Zotero, float on
windowrule {
    name = zotero-progress
    match:class = Zotero
    move = 100%-w-20 100%-w-20
}
windowrule {
    name = keepass-unlock
    match:class = org.keepassxc.KeePassXC
    match:title = ^Unlock Database.*$
    pin = on
}
windowrule {
    name = keepass-unlock
    match:class = org.keepassxc.KeePassXC
    match:title = ^.*Access Request$
    pin = on
    move = move 100%-w-20 100%-w-20
}

###########
### HY3 ###
###########

# Hy3 config
plugin {
  hy3 {
    # disable gaps when only one window is onscreen
    # 0 - always show gaps
    # 1 - hide gaps with a single window onscreen
    # 2 - 1 but also show the window border
    no_gaps_when_only = 1 # default: 0

    # policy controlling what happens when a node is removed from a group,
    # leaving only a group
    # 0 = remove the nested group
    # 1 = keep the nested group
    # 2 = keep the nested group only if its parent is a tab group
    #node_collapse_policy = <int> # default: 2

    # offset from group split direction when only one window is in a group
    #group_inset = <int> # default: 10

    # if a tab group will automatically be created for the first window spawned in a workspace
    #tab_first_window = <bool>

    # tab group settings
    tabs {
      # height of the tab bar
      #height = <int> # default: 22

      # padding between the tab bar and its focused node
      #padding = <int> # default: 6

      # the tab bar should animate in/out from the top instead of below the window
      #from_top = <bool> # default: false

      # radius of tab bar corners
      #radius = <int> # default: 6

      # tab bar border width
      #border_width = <int> # default: 2

      # render the window title on the bar
      #render_text = <bool> # default: true

      # center the window title
      #text_center = <bool> # default: true

      # font to render the window title with
      #text_font = <string> # default: Sans

      # height of the window title
      #text_height = <int> # default: 8

      # left padding of the window title
      #text_padding = <int> # default: 3

      # active tab bar segment colors
      col.active = rgba($mauveAlpha40) # default: rgba(33ccff40)
      col.active.border = $mauve # default: rgba(33ccffee)
      col.active.text = $text # default: rgba(ffffffff)

      # focused tab bar segment colors (focused node in unfocused container)
      col.focused = rgba($surface0Alpha40) # default: rgba(60606040)
      col.focused.border = $surface0 # default: rgba(808080ee)
      col.focused.text = $text # default: rgba(ffffffff)

      # inactive tab bar segment colors
      col.inactive = rgba($surface2Alpha20) # default: rgba(30303020)
      col.inactive.border = $surface1 # default: rgba(606060aa)
      col.inactive.text = $text # default: rgba(ffffffff)

      # urgent tab bar segment colors
      col.urgent = rgba($rosewaterAlpha40) # default: rgba(ff223340)
      col.urgent.border = $rosewater # default: rgba(ff2233ee)
      col.urgent.text = $text # default: rgba(ffffffff)

      # locked tab bar segment colors
      col.locked = rgba($lavenderAlpha40) # default: rgba(90903340)
      col.locked.border = $lavender # default: rgba(909033ee)
      col.locked.text = $text # default: rgba(ffffffff)

      # if tab backgrounds should be blurred
      # Blur is only visible when the above colors are not opaque.
      #blur = <bool> # default: true

      # opacity multiplier for tabs
      # Applies to blur as well as the given colors.
      #opacity = <float> # default: 1.0
    }

    # autotiling settings
    autotile {
      # enable autotile
      enable = true # default: false

      # make autotile-created groups ephemeral
      #ephemeral_groups = <bool> # default: true

      # if a window would be squished smaller than this width, a vertical split will be created
      # -1 = never automatically split vertically
      # 0 = always automatically split vertically
      # <number> = pixel width to split at
      #trigger_width = <int> # default: 0

      # if a window would be squished smaller than this height, a horizontal split will be created
      # -1 = never automatically split horizontally
      # 0 = always automatically split horizontally
      # <number> = pixel height to split at
      #trigger_height = <int> # default: 0

      # a space or comma separated list of workspace ids where autotile should be enabled
      # it's possible to create an exception rule by prefixing the definition with "not:"
      # workspaces = 1,2 # autotiling will only be enabled on workspaces 1 and 2
      # workspaces = not:1,2 # autotiling will be enabled on all workspaces except 1 and 2
      #workspaces = <string> # default: all
    }
  }
}
